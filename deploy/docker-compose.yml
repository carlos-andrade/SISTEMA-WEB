name: sistema-web-v1
services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sistema-web-v1-backend
    restart: unless-stopped
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LICITACAO_REPOSITORY: ${LICITACAO_REPOSITORY:-carlos-andrade/LICITACAO}
      LICITACAO_REF: ${LICITACAO_REF:-main}
    ports:
      - "192.168.60.141:8000:8000"
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [sistema-web]
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: sistema-web-v1-frontend
    restart: unless-stopped
    command: ["npm","run","dev","--","--host","0.0.0.0"]
    ports:
      - "192.168.60.141:5173:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks: [sistema-web]
volumes:
  frontend_node_modules:
networks:
  sistema-web:
    name: sistema-web-v1-network
    driver: bridge
